<html lang="en">
<head>

<style>
:root{
--bg:#070708; --panel:rgba(11,10,9,.80); --line:rgba(216,205,180,.16);
--bone:#d8cdb4; --dim:#7f786c; --rust:#c25a3b; --ok:#9fb07c; --warn:#dca54a; --crit:#d0412c;

color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--bone);overflow:hidden;font:12px/1.35 var(--mono)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;background:var(--bg)}
#fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
.hud{position:fixed;pointer-events:none;z-index:2}
#top{top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.box{background:var(--panel);border:1px solid var(--line);padding:6px 9px}
#res{display:flex;gap:2px 14px;flex-wrap:wrap}
.r span{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.r b{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.r b.low{color:var(--crit)} .r b.mid{color:var(--warn)}
#status{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.flag{font-size:10px;letter-spacing:.1em;padding:1px 5px;border:1px solid var(--crit);color:var(--crit)}
.flag.w{border-color:var(--warn);color:var(--warn)}
#zonebox{min-width:230px;max-width:340px}
#zone{font:20px/1 var(--disp);letter-spacing:.04em}
#zonesub{color:var(--dim);font-size:10.5px;margin-top:2px}
.prog{height:4px;background:rgba(216,205,180,.12);margin-top:6px;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--bone)}
#legtxt{font-size:10.5px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}

#log div.bad{border-color:var(--crit)} #log div.good{border-color:var(--ok)} #log div.warn{border-color:var(--warn)}
#prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 112px);left:50%;transform:translateX(-50%);font:22px/1 var(--disp);letter-spacing:.05em;text-align:center;text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap}
#prompt small{display:block;font:11px var(--mono);color:var(--dim);margin-top:3px}
#trainbar{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;justify-content:center;flex-wrap:wrap-reverse;pointer-events:none}
.cars{display:flex;flex-direction:row-reverse;flex-wrap:wrap-reverse;justify-content:center;max-width:100%;gap:5px;pointer-events:auto}
.car{background:var(--panel);border:1px solid var(--line);padding:4px 5px 5px}
.car.loose{opacity:.55;border-style:dashed}
.car h4{margin:0 0 3px;font:600 9.5px var(--mono);letter-spacing:.12em;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.car h4 em{font-style:normal;color:var(--bone);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(4,var(--cw,36px));grid-template-rows:repeat(2,24px);gap:2px}
.grid.grid3{grid-template-columns:repeat(3,56px);grid-template-rows:28px}
.cell{border:0;margin:0;font:600 8.5px/1.05 var(--mono);color:#0d0c0b;padding:2px 3px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;letter-spacing:.03em}
.cell:focus-visible{outline:1px solid var(--bone);outline-offset:1px}
.cell.dead{color:var(--crit)!important;background:#1d0f0d!important;box-shadow:inset 0 0 0 1px var(--crit)}
.cell.fire{box-shadow:inset 0 0 0 2px var(--warn);animation:burn .5s steps(2) infinite}
.cell.auto{outline:2px solid #ffd24a;outline-offset:-2px;animation:cruise 1s ease-in-out infinite}
@keyframes cruise{50%{outline-color:rgba(255,210,74,.25)}}
@keyframes burn{50%{box-shadow:inset 0 0 0 2px var(--rust)}}
#keys{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);font-size:10px;color:var(--dim);text-align:right;line-height:1.55}
#keys b{color:var(--bone);font-weight:600}
#overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(5,5,6,.62);padding:16px}
#overlay[hidden]{display:none!important}
.panel{background:rgba(12,11,10,.94);border:1px solid var(--line);padding:22px 26px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.panel.wide{max-width:860px}
.panel.codex{max-width:960px}
.cx-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-bottom:14px}
.cx-card{border:1px solid var(--line);background:rgba(20,19,18,.85);padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.cx-card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:4px}
.cx-card header b{font:600 12px var(--mono);color:var(--bone);letter-spacing:.06em}
.cx-card header small{font:10px var(--mono);color:var(--warn)}
.cx-art{background:#141312;border:1px solid var(--line);padding:6px;display:grid;place-items:center;min-height:64px}
.cx-art canvas{image-rendering:pixelated;max-width:100%;height:auto}
.cx-meta{font-size:10.5px;color:#bdb39c;line-height:1.45}
.cx-tags{display:flex;flex-wrap:wrap;gap:3px}
.cx-tags span{font:600 9.5px var(--mono);padding:1px 5px;background:rgba(216,205,180,.09);border:1px solid var(--line);color:var(--bone)}
/* station (v3.43): the panel ends above the train bar instead of sliding under it, and play-only HUD is put away */
body.station #overlay{padding-bottom:var(--tb,128px);place-items:start center}
body.station .panel{box-sizing:border-box;max-height:calc(100vh - 16px - var(--tb,128px))}
body.station #keys,body.station #prompt,body.station #viewbar,body.station #log{display:none!important}
body.station #trainbar{z-index:6}
.station{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.station h3{font:600 10px var(--mono);letter-spacing:.18em;color:var(--dim);margin:0 0 8px;text-transform:uppercase}
.up{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.uprow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.uprow .nm{width:96px;font:600 9.5px var(--mono);letter-spacing:.1em;color:var(--dim)}
.ub{font:10px/1.25 var(--mono);background:transparent;border:1px solid var(--line);color:var(--bone);padding:3px 6px;cursor:pointer;text-align:left}

.ub i{font-style:normal;color:var(--warn)}
.ub.max{border-style:dashed;color:var(--ok)}
.order{display:flex;flex-wrap:wrap;gap:4px;align-items:stretch;margin-bottom:6px}
.oc{border:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:4px;min-width:96px}
.oc b{font:600 9.5px var(--mono);letter-spacing:.08em}
.oc span{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.oc .ob{display:flex;gap:3px}
.oc .ub{padding:2px 6px}
.oc.fixed{border-style:dashed}
.oc .warn{color:var(--crit)}
.oarrow{align-self:center;color:var(--dim);font-size:11px}
.tel td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:inline-block;height:6px;background:var(--rust);vertical-align:middle;margin-left:8px}
.hold{font-variant-numeric:tabular-nums;color:var(--bone)!important}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.go.alt{border-color:var(--dim);color:var(--dim)}
#map{display:block;width:100%;height:30px;margin-top:6px}
@media (max-width:760px){.station{grid-template-columns:1fr}}
.panel h1{font:44px/0.9 var(--disp);margin:0 0 4px;letter-spacing:.03em}
.panel h2{font:600 10px var(--mono);letter-spacing:.2em;color:var(--rust);margin:0 0 14px;text-transform:uppercase}
.panel p{margin:0 0 10px;color:#bdb39c;font-size:12px}
.panel table{border-collapse:collapse;width:100%;font-size:11.5px;margin:6px 0 14px}
.panel td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:top}
.panel td:first-child{color:var(--bone);font-weight:600;white-space:nowrap;padding-right:14px}

.go{font:22px var(--disp);letter-spacing:.06em;color:var(--bone);background:transparent;border:1px solid var(--bone);padding:6px 16px;cursor:pointer}

#dev[hidden]{display:none!important}
#dev header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.dstats b{color:var(--bone);font-weight:600}
.dl{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-right:4px}

.kn{display:grid;grid-template-columns:1fr 92px 46px;gap:6px;align-items:center;font-size:10.5px;padding:2px 0}
.kn label{color:#bdb39c;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kn.chg label{color:var(--warn)}

.dp{font-size:11px;color:#a79e89;margin:0 0 8px}
.dtail{margin-top:8px;font-size:10px;line-height:1.45;color:#9b927e;max-height:180px;overflow:auto;font-variant-numeric:tabular-nums}
.dtail .bad{color:var(--crit)}.dtail .good{color:var(--ok)}.dtail .warn{color:var(--warn)}.dtail .snap{color:#6f685d}
body.dev #zonebox{visibility:hidden}
body.dev #trainbar{right:calc(min(390px,100vw) + 12px)}
body.dev #keys{display:none}
#viewbar{top:calc(env(safe-area-inset-top,0px) + 96px);left:max(12px,env(safe-area-inset-left,0px));pointer-events:auto;display:flex;gap:5px;align-items:center;padding:5px 7px}
#viewbar .vl{font-size:9px;letter-spacing:.14em;color:var(--dim);margin-left:6px}

#viewbar b:hover{color:var(--warn)}
.vb{font:600 11px var(--mono);background:transparent;border:1px solid var(--line);color:var(--bone);padding:3px 8px;cursor:pointer;min-width:26px}
.vb:hover,.vb:focus-visible{border-color:var(--bone);outline:none}
#vbAscii[aria-pressed=false]{color:#0c0b0a;background:var(--warn);border-color:var(--warn)}

body.title #viewbar{top:calc(env(safe-area-inset-top,0px) + 12px)}
#ws{position:fixed;z-index:4;top:0;bottom:0;left:0;width:min(480px,100vw);overflow:auto;background:rgba(11,10,9,.95);border-right:1px solid var(--line);padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:16px}
#ws[hidden]{display:none!important}
#ws header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#ws h1{font:34px/0.9 var(--disp);margin:0;letter-spacing:.03em}
#ws h2{font:600 10px var(--mono);letter-spacing:.2em;color:var(--rust);margin:0 0 4px;text-transform:uppercase}
#ws h3{font:600 10px var(--mono);letter-spacing:.18em;color:var(--dim);margin:0 0 8px;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
#ws h3 small{font-weight:400;letter-spacing:.04em;text-transform:none}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.tab{font:600 10px var(--mono);letter-spacing:.08em;padding:5px 8px;background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer}

.drop b{font:600 10px var(--mono);letter-spacing:.12em}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

function brut(c,X,Y,rustAmt=.32,seamX=0,rivetY=-1){

const ru=clamp((streak*.75+Math.max(0,hash2(X*5,Y*3)-.55)*1.1)*rustAmt,0,.78);
r=lerp(r,118+g1*28,ru);g=lerp(g,56+g1*16,ru);b=lerp(b,32+g1*10,ru);
if(seamX&&X%seamX===0){r*=.58;g*=.58;b*=.58}
if(rivetY>=0&&(Y===rivetY||Y===rivetY+1)&&X%4===1){const hi=Y===rivetY?1.38:.65;r*=hi;g*=hi;b*=hi}
return[clamp(r,8,255),clamp(g,8,255),clamp(b,8,255)]}

const span=(a,b,s)=>[Math.floor(a*s),Math.ceil((b+1)*s)-1];
const P={
px(x,y,m,col){x|=0;y|=0;const[X0,X1]=span(x,x,sx),[Y0,Y1]=span(y,y,sy);for(let Y=Y0;Y<=Y1;Y++)for(let X=X0;X<=X1;X++)raw(X,Y,m,F(col,X,Y))},

rect(x0,y0,x1,y1,m,f){const[X0,X1]=span(x0,x1,sx),[Y0,Y1]=span(y0,y1,sy);for(let Y=Y0;Y<=Y1;Y++)for(let X=X0;X<=X1;X++)raw(X,Y,m,F(f,X,Y))},
ellipse(cx,cy,rx,ry,m,f,keep){const CX=cx*sx,CY=cy*sy,RX=rx*sx,RY=ry*sy;for(let Y=Math.floor(CY-RY);Y<=Math.ceil(CY+RY);Y++)for(let X=Math.floor(CX-RX);X<=Math.ceil(CX+RX);X++){const dx=(X+.5-CX)/RX,dy=(Y+.5-CY)/RY;if(dx*dx+dy*dy<=1&&(!keep||keep(X/sx,Y/sy,X,Y)))raw(X,Y,m,F(f,X,Y))}},
wheel(cx,cy,r){const CX=cx*sx,CY=cy*sy,Rr=r*Math.min(sx,sy),id=c.wheels.length;c.wheels.push({cx:CX,cy:CY,r:Rr});
for(let Y=Math.floor(CY-Rr);Y<=Math.ceil(CY+Rr);Y++)for(let X=Math.floor(CX-Rr);X<=Math.ceil(CX+Rr);X++){const dx=X+.5-CX,dy=Y+.5-CY;if(dx*dx+dy*dy<=Rr*Rr&&X>=0&&Y>=0&&X<w&&Y<h){raw(X,Y,M.WHEEL,[96,90,82]);c.wid[Y*w+X]=id}}},
sil(x,y,slot){const[X0,X1]=span(x,x,sx),[Y0,Y1]=span(y,y,sy);for(let Y=Y0;Y<=Y1;Y++)for(let X=X0;X<=X1;X++)if(X>=0&&Y>=0&&X<w&&Y<h)c.sil[Y*w+X]=slot+1},

/* =====================================================================

   Every pixel of the MATERIAL layer is an asset. A unit is not "a plane with 10 fuel":
   it is whatever its pixels add up to. Four laws, all counted from the pixels that are
   still alive, so damage changes every number the moment a pixel dies:

   1. WEIGHT    mass = Σ material mass per pixel. Tanks weigh less as they empty.
   2. STORAGE   container materials ARE the storage: FUEL pixels are the fuel tank,
                WATER the cistern, AMMO the magazine, SCRAP the hold, CLOTH the kit bags,
                BATTERY the charge. Capacity = pixels × CFG.px.<resource>.
   3. FUNCTION  a section does its job (its role) in proportion to the WORKING material
                painted in it: engine work in ENGINE/BOILER, grip in WHEEL sections,
                bite in the drill head, lift from the skin of the whole body.
   4. BALANCE   nothing is free: every pixel adds weight. Thrust, lift, traction and bite
                are measured against the weight they have to move.

   Yields are calibrated against the built-in units (the "reference designs"): the stock
   locomotive has 100% traction and a +30% boiler, the stock plane flies exactly as before.
   A unit built differently performs differently — that is the whole point.

/* FUNCTION + BALANCE for vehicles: how this design compares with the reference of its kind.
   eng/lift/bite/size are design ratios (1 = the stock unit); mass is live. */
function ledgerRatios(c){const R=ledgerRef()[c.vkind],a=c.as||ledger(c);if(!R)return{eng:1,lift:1,bite:1,size:1,mass:1,ref:null};

{const nb=Math.floor(vc.shots/CFG.airShotsPerAmmo),cost=`(${f1(vc.shots/CFG.airShotsPerAmmo)} train ammo to fill)`;

if(c.vkind==='plane'){const Tmax=q.ref.am*A.accel*q.eng,kL=q.ref.am*g/(A.vTrim*A.vTrim)*q.lift,kD=q.ref.am*A.accel/(A.vMax*A.vMax)*q.size;

out.push([vTop<vMin*1.08?'e':vTop<vMin*1.3?'w':'o',`Flight: stalls below ${Math.round(vMin)} · cruises ${Math.round(vTrim)} · tops out at ${Math.round(vTop)} px/s`+(vTop<vMin*1.08?' — too heavy for its wing skin and engine: it cannot stay up. Use lighter skin (ALU, CLOTH, KEVLAR) or more engine.':vTop<vMin*1.3?' — barely flies; little margin.':'')]);
out.push(['o',`Engine work ${pc(q.eng)} · wing lift ${pc(q.lift)} · weight ${pc(q.mass)} of the stock plane`])}
else if(c.vkind==='heli'||c.vkind==='drone'){const hov=A.rotor*q.eng/q.mass;
out.push([hov<1.03?'e':hov<1.2?'w':'o',`Rotor lifts ${hov.toFixed(2)}× its own weight`+(hov<1.03?' — it cannot leave the deck. More ENGINE work (STEEL, WIRE, OIL, COAL) or less weight.':hov<1.2?' — sluggish climb.':'')]);
out.push(['o',`Engine work ${pc(q.eng)} · weight ${pc(q.mass)} of the stock ${c.vkind==='heli'?'gunship':'drone'}`])}

else{const R=ledgerRef(),st=[];if(S.fuel+S.charge)st.push(`fuel ${Math.round(S.fuel+S.charge)}`);if(S.water)st.push(`water ${Math.round(S.water)}`);if(S.ammo)st.push(`ammo ${Math.round(S.ammo)}`);if(S.scrap)st.push(`scrap ${Math.round(S.scrap)}`);if(S.equip)st.push(`equipment ${Math.round(S.equip)}`);

/* =====================================================================
   CONTROL (v3.25) — the player drives the train OR flies one of the train's own aircraft, and
   switches between them. One rule for every section ability:
     • click a section that is 100% → its ability switches on (or you take control);
     • the ability keeps working while the section stays at or above CFG.abilityKeep (70%);
     • a damaged section is repaired by the click instead (the old rule).
   Abilities: CAB → auto drive · CANNON → auto gunner · DECK → launch / fly the deck's aircraft
   (all DECK sections at 100%) · SEATS → send that car's crew looting.
   A deck carries ONE aircraft (CARS[type].bay: the carrier a plane, the helipad a helicopter).
   Launching takes a pilot from the crew and fills the aircraft from the train (gas from fuel, ammo).
   Land softly on your own deck to refuel, re-arm and repair it (scrap). [J] ejects: the pilot
   parachutes down and walks back like a looter (and can be shot on the way); you take over the
   nearest unit. A crash with the pilot aboard kills them.
   ===================================================================== */

else if(a==='pxdrone'){spawnAir('drone')}

else if(a==='rocks'){for(let i=0;i<5;i++)spawnRock()}
else if(a==='obstacle')addObstacle(L.x+L.w/2+170,Math.random()<.5?'rock':'wreck');
else if(a==='fire'){const c=pick(cars);for(let n=0;n<25;n++){const k=(Math.random()*c.n)|0;if(c.mat[k]&&FLAM[c.mat[k]]>0)c.fire[k]=.8}}
else if(a==='blast'){const c=pick(cars);G.explQ.push({x:c.cxw+rand(-c.w*.3,c.w*.3),y:c.cyw+rand(-6,6),r:9,p:150,ign:.5,cause:'test blast'})}
else if(a==='res'){computeCaps();for(const k of['fuel','scrap','ammo','equip'])G.res[k]=Math.min(G.caps[k],G.res[k]+10)}
else if(a==='crew'){const m=addCrew({kit:[['water',2]]});log(`${m.name} joins the crew`,'good')}
else if(a==='fix'){for(const c of cars){for(let k=0;k<c.n;k++){c.mat[k]=c.omat[k];c.hp[k]=c.omat[k]?MAXHP[c.omat[k]]:0;c.fire[k]=0;c.rust[k]=0}updateRegions(c)}}
else if(a==='station'){G.train.x=G.world.LEN-120;G.train.v=0}
else if(a==='ahead'){G.train.x=Math.min(G.world.LEN-60,G.train.x+500);G.camX=G.train.x-S.W*.6}
else if(a==='wagon'){if(cars.length<8){const c=makeCar(pick(['tender','passenger','armored','cargo','crane','water']));updateRegions(c);cars.push(c)}}
G.mlog.push({t:G.tel.time,leg:G.leg,x:Math.round(L.ax),msg:`TEST ${label||a}`,cls:'warn'});
}

function trainChecks(){
const out=[],cs=CONSIST.filter(t=>CARS[t]);if(!cs.length)return[['e','The train is empty.']];
if(CARS[cs[0]].base!=='loco')out.push(['e','The first unit must be a locomotive (the default train is used until fixed).']);
const roles=cs.flatMap(t=>CARS[t].roles);
if(!roles.includes('CAB'))out.push(['e','No CAB anywhere — nobody can drive.']);
const tr=roles.filter(x=>x==='WHEEL').length;out.push([tr>=4?'o':'w',`Traction ${tr*25}%`]);
if(roles.includes('PUMP')&&!roles.includes('WATER'))out.push(['w','A PUMP but no WATER section.']);
if(roles.includes('CANNON')&&!roles.includes('AMMO'))out.push(['w','A CANNON but no AMMO storage.']);
if(!roles.includes('SEATS'))out.push(['w','No SEATS: extra crew ride on the roof and fall off.']);
const mass=cs.reduce((a,t)=>a+(CARS[t].mass||1),0);out.push(['o',`${cs.length} units · total mass ${mass.toFixed(2)}`]);
return out;
}

   A block is one third of a stock vehicle, pixels and all: an engine-and-tank block,
   a cab, a gun-and-bomb block, a passenger cabin. Any block can go in any position.
   The FRAME is what makes the thing a kind of machine, and it is where the "how does

/* =====================================================================
   AGENTS, ARENA AND DUELS (v3.43)

   Anything that plays the game — a scripted bot, a language model behind an
   endpoint, a script in the console — plays through ONE interface:

     IronAsh.observe()            what the agent can see (plain JSON)
     IronAsh.act(action)          what it wants (plain JSON, see AGENT_ACTIONS)
     IronAsh.run({agent,seed})    play one seeded episode, returns the score
     IronAsh.tournament({...})    every agent on every seed, ranked

   An agent does not steer frame by frame. It sets a DOCTRINE — how fast, how
   greedy, how careful, what to do about an ambush — and the train's own crew
   (the autopilot in 18) carries it out. Every few seconds the agent looks again
   and may change its mind or give a direct order. That is the right grain for a
   language model, and it means bots and models compete on judgment, not reflexes.

   Episodes are seeded: the simulation draws from its own random stream, so the
   same agent on the same seed plays the same game, and two agents on one seed
   face the same world.

   v3.44 — LEARNING: an agent may also have start(info) (gets the rulebook) and end(report) (gets the match
   report). IronAsh.league runs practice rounds, where learners update their memory, and test rounds on
   seeds nobody practises on; the test score per round is the learning curve. See docs/AGENTS.md.
   ===================================================================== */

rows.push({round:r,set,agent:res.agent,seed,result:res.result,score:res.score,simMinutes:res.simMinutes,decisions:res.decisions});if(res.lesson)lessons.push(`${res.agent} · ${res.lesson}`);
if(opt.onResult)opt.onResult(res,rows);if(res.result==='stopped')break outer}}
for(const a of agents){const t=rows.filter(x=>x.round===r&&x.set==='test'&&x.agent===nm(a));if(t.length)(curve[nm(a)]=curve[nm(a)]||[])[r-1]=Math.round(t.reduce((s,x)=>s+x.score,0)/t.length)}}
const out={when:Date.now(),opt:{practice,test,rounds,legs:base.legs},curve,elo:leagueElo(rows.filter(x=>x.set==='test')),lessons,rows};
try{localStorage.setItem('ironash.league.v1',JSON.stringify(out))}catch(e){}return out}
function leagueElo(rows){const R={},games={};for(const x of rows){R[x.agent]=1000;(games[x.round+':'+x.seed]=games[x.round+':'+x.seed]||[]).push(x)}
for(const g of Object.values(games))for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const a=g[i],b=g[j],ea=1/(1+10**((R[b.agent]-R[a.agent])/400)),sa=a.score>b.score?1:a.score<b.score?0:.5;R[a.agent]+=24*(sa-ea);R[b.agent]-=24*(sa-ea)}
return Object.entries(R).map(([agent,r])=>({agent,elo:Math.round(r)})).sort((a,b)=>b.elo-a.elo)}
function leagueHTML(L){if(!L||!L.curve||!Object.keys(L.curve).length)return'<p class="note">No league played yet.</p>';const n=L.opt.rounds,names=Object.keys(L.curve),all=names.flatMap(k=>L.curve[k].filter(v=>v!=null)),lo=Math.min(...all),hi=Math.max(...all,lo+1);
const spark=v=>`<svg width="120" height="26" viewBox="0 0 120 26" style="vertical-align:middle"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${v.map((y,i)=>y==null?'':`${n>1?i*118/(n-1)+1:60},${24-(y-lo)/(hi-lo)*22}`).filter(Boolean).join(' ')}"/></svg>`;
return`<table><tr><td>Agent</td>${Array.from({length:n},(_,i)=>`<td>R${i+1}</td>`).join('')}<td>Curve</td><td>Elo</td></tr>${names.map(k=>`<tr><td><b>${k}</b></td>${Array.from({length:n},(_,i)=>`<td>${L.curve[k][i]??'–'}</td>`).join('')}<td>${spark(L.curve[k])}</td><td>${(L.elo.find(e=>e.agent===k)||{}).elo??''}</td></tr>`).join('')}</table>
<p class="note">Test score per round (seeds ${L.opt.test.join(', ')}; practice ${L.opt.practice.join(', ')}).</p>${L.lessons.length?`<div class="note">${L.lessons.slice(-8).map(s=>`<div>${s.replace(/</g,'&lt;')}</div>`).join('')}</div>`:''}`}
function arenaBar(name,seed){let b=$('arenaBar');if(b)b.remove();b=document.createElement('div');b.id='arenaBar';b.className='hud box';b.innerHTML=`<b>${name}</b> <span>seed ${seed}</span> <span id="arenaT"></span> <button class="ub2" type="button" id="arenaStop">STOP</button>`;document.body.appendChild(b);$('arenaStop').onclick=()=>{ARENA.stop=true}}
function arenaBarTick(simT){const e=$('arenaT');if(e)e.textContent=`${Math.floor(simT/60)}:${String(Math.floor(simT%60)).padStart(2,'0')} · score ${agentScore().total}`}

/* ---------------------------------------------------------------------
   DUEL — two trains on one line, facing each other. Nobody leaves.
   The duel is decided by CREW: a train whose crew is dead or has had enough
   strikes its colours. Your train is the one you built and the crew you kept
   alive; the rival is a mirror of it, or a train card someone sent you.
   --------------------------------------------------------------------- */
function trainCard(){return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,name:'Engine '+(1+(G.seed||0)%99),consist:G.train.cars.map(c=>c.type),lvl:G.train.cars.map(c=>Array.from(c.lvl)),crew:(G.crew||[]).filter(m=>m.alive).length||5}))))}
function readTrainCard(txt){try{const o=JSON.parse(decodeURIComponent(escape(atob(String(txt).trim()))));if(!Array.isArray(o.consist)||!o.consist.length)return null;o.consist=o.consist.filter(t=>CARS[t]&&!isAirUnit(CARS[t])).slice(0,8);return o.consist.length?o:null}catch(e){return null}}
function duelSetup(card){
const cars=G.train.cars,L=cars[0],front=L.x+L.w/2,types=card?card.consist:cars.map(c=>c.type),R={cars:[],name:card&&card.name||'The Mirror',crew0:card&&card.crew||Math.max(3,(G.crew||[]).filter(m=>m.alive).length),gun:2.5,rifle:1,x0:front+CFG.duelGap};
let x=R.x0;types.forEach((t,i)=>{const c=makeCar(t);c.enemy=true;c.rival=true;c.fx=-1;if(card&&card.lvl&&card.lvl[i])c.lvl.set(card.lvl[i].slice(0,8));setMul(c);c.occ.fill(1);
c.ax=x+c.w/2;const xr=c.ax-c.w*.35,xf=c.ax+c.w*.35;c.ang=Math.atan2(T(xf)-T(xr),xf-xr);c.ay=T(c.ax);c.vx=0;c.vy=0;vehPose(c);updateRegions(c);R.cars.push(c);x+=c.w+CFG.gap});
R.px0=R.cars.reduce((a,c)=>a+c.totalMax,0);R.n0=R.cars.length;R.crew=R.crew0;/* both sides come to a duel armed: full magazine and tanks */computeCaps();G.res.ammo=G.caps.ammo;G.res.fuel=Math.max(G.res.fuel,G.caps.fuel*.6);G.rival=R;G.duel={t:0};G.duelResult=null;G.dev.calm=true;G.raiders=[];G.obstacles=G.obstacles.filter(o=>o.x<front-40||o.x>x+40);
log(`DUEL — ${R.name} blocks the line with ${R.crew0} crew. Only one train leaves. Their crew breaks when they have lost enough of it`,'bad');sfx('bad')}
function duelTick(dt){const R=G.rival;if(!R||G.duelResult)return;const cars=G.train.cars,L=cars[0],front=L.x+L.w/2;G.duel.t+=dt;
for(let i=R.cars.length-1;i>=0;i--){const c=R.cars[i];if(c.integrity<CFG.carDeathAt){G.explQ.push({x:c.cxw,y:c.cyw,r:12,p:150,ign:.6,cause:'cannon'});for(let k=0;k<c.n;k+=3)if(c.mat[k])destroyPixel(c,k,rand(-60,60),rand(-90,-10),'hit');R.cars.splice(i,1);log(`${R.name}: their ${c.d.name.toLowerCase()} is destroyed`,'good')}}
/* their crew stands or falls with the train they are standing in */
/* judged by the two worst-hit wagons (a destroyed one counts as zero): a train that is being taken apart loses heart long before it is scrap */
const ints=R.cars.map(c=>c.integrity);while(ints.length<R.n0)ints.push(0);ints.sort((x,y)=>x-y);const worst=(ints[0]+(ints[1]??ints[0]))/2,share=clamp((worst-.35)/.6,0,1),crew=Math.ceil(R.crew0*share);
if(crew<R.crew){log(`${R.name} lost ${R.crew-crew} crew — ${crew} left`,'good');R.crew=crew;G.hudSig=''}
if(!R.cars.length||R.crew<=0){duelEnd(true,`${R.name} has nobody left to fight.`);return}
if(R.crew<=Math.max(1,Math.floor(R.crew0*CFG.duelBreak))){duelEnd(true,`${R.name} strikes its colours with ${R.crew} of ${R.crew0} crew left.`);return}
if(front>R.x0-14&&G.train.v>0)G.train.v=0;
/* their gun and their rifles */
const tgt=pick(cars),aim=toWorld(tgt,rand(8,tgt.w-8),rand(6,tgt.h-10));
R.gun-=dt;if(R.gun<=0){const gc=R.cars.find(c=>{const r=c.d.roles.indexOf('CANNON');return r>=0&&c.alive[r]});
if(gc){const tp=gc.pts.turret||[gc.w/2,4],p=toWorld(gc,tp[0],tp[1]),a=Math.atan2(aim[1]-p[1],aim[0]-p[0])+rand(-.03,.03);
G.shots.push({x:p[0],y:p[1],vx:Math.cos(a)*210,vy:Math.sin(a)*210,kind:'rpg',src:'raider',why:'rival cannon',pow:CFG.duelGunPow,rad:9,life:4});sfx('gun',1,p[0]);addLight(p[0],p[1],24,.9,.1,'255,200,120');R.gun=CFG.duelReload*rand(.85,1.2)}else R.gun=1}
R.rifle-=dt;if(R.rifle<=0&&R.cars.length){R.rifle=clamp(3.2/Math.max(1,R.crew),.25,2);const sc=pick(R.cars),p=toWorld(sc,rand(10,sc.w-10),sc.d.split*.5),d=Math.hypot(aim[0]-p[0],aim[1]-p[1]);
if(d<560){const a=Math.atan2(aim[1]-p[1],aim[0]-p[0])+rand(-.05,.05);G.shots.push({x:p[0],y:p[1],vx:Math.cos(a)*190,vy:Math.sin(a)*190,kind:'bullet',src:'raider',why:'rival rifle fire',life:d/190+.4});if(Math.random()<.5)sfx('shot',.5,p[0])}}
}
function duelEnd(win,why){if(!G.rival||G.duelResult)return;G.duelResult={win,why,t:G.duel?G.duel.t:0,crew:(G.crew||[]).filter(m=>m.alive).length,rivalCrew:G.rival.crew,rivalCrew0:G.rival.crew0};
log(win?`DUEL WON — ${why}`:`DUEL LOST — ${why}`,win?'good':'bad');sfx(win?'loot':'bad');
if(ARENA.running)return;G.paused=true;
overlay.hidden=false;panel.className='panel';panel.innerHTML=`<h2>Duel · ${Math.round(G.duelResult.t)} s</h2><h1>${win?'VICTORY':'DEFEAT'}</h1><p>${why}</p>
<table><tr><td>Your crew</td><td>${G.duelResult.crew} alive</td></tr><tr><td>${G.rival.name}</td><td>${G.rival.crew} of ${G.rival.crew0} left</td></tr><tr><td>Your train</td><td>${G.train.cars.map(c=>Math.round(c.integrity*100)+'%').join(' · ')}</td></tr></table>
<div class="btns"><button class="go" id="duelBack" type="button">BACK TO TITLE</button></div>`;
$('duelBack').onclick=()=>{G.rival=null;G.duel=null;G.duelResult=null;G.paused=false;G.dev.calm=false;showTitle()}}
function startDuel(card){const d=readSave();overlay.hidden=true;document.body.classList.remove('station','title');
if(d){loadGame(d);if(G.state==='leg'){overlay.hidden=true;document.body.classList.remove('station');startLeg()}}else startRun();
G.paused=false;duelSetup(card||null)}

/* ---------------------------------------------------------------------
   ARENA SCREEN
   --------------------------------------------------------------------- */
function showArena(){overlay.hidden=false;panel.className='panel wide';
let last=null,lastLg=null;try{last=JSON.parse(localStorage.getItem('ironash.arena.v1')||'null');lastLg=JSON.parse(localStorage.getItem('ironash.league.v1')||'null')}catch(e){}
const boardHTML=b=>b&&b.length?`<table><tr><td>Agent</td><td>Mean score</td><td>Best</td><td>Games</td><td>Finished</td><td>Destroyed</td><td>Duels won</td></tr>${b.map((r,i)=>`<tr><td>${i+1}. ${r.agent}</td><td><b>${r.mean}</b></td><td>${r.best}</td><td>${r.games}</td><td>${r.finished}</td><td>${r.destroyed}</td><td>${r.won}</td></tr>`).join('')}</table>`:'<p class="note">No results yet.</p>';
panel.innerHTML=`<h2>Iron & Ash · v${GAME_VERSION}</h2><h1>ARENA</h1>
<p>Agents play the same seeded worlds and are ranked by score: legs finished, distance, crew kept alive, the state of the train, kills and stores. An agent sets standing orders for the crew and looks again every few seconds.</p>
<section><h3>Agents</h3><div id="arAgents">${Object.entries(BOTS).map(([k,b])=>`<label class="chk" style="display:block;margin:2px 0"><input type="checkbox" data-bot="${k}" checked> <b>${b.label}</b> — ${b.note}</label>`).join('')}${ARENA.agents.map((a,i)=>`<label class="chk" style="display:block;margin:2px 0"><input type="checkbox" data-ext="${i}" checked> <b>${a.name}</b> — endpoint agent</label>`).join('')}</div>
<div class="row" style="margin-top:8px;align-items:flex-end"><div class="fld" style="max-width:150px"><label for="arName">Endpoint agent name</label><input id="arName" maxlength="18" placeholder="e.g. Claude"></div><div class="fld"><label for="arUrl">Endpoint URL (yours — see docs/AGENTS.md)</label><input id="arUrl" placeholder="http://localhost:8787/claude-a"></div><button class="ub2" id="arAdd" type="button">Add</button></div></section>
<section><h3>Tournament</h3><div class="row" style="align-items:flex-end"><div class="fld" style="max-width:90px"><label for="arSeeds">Seeds</label><input id="arSeeds" type="number" min="1" max="10" value="2"></div><div class="fld" style="max-width:90px"><label for="arLegs">Legs</label><input id="arLegs" type="number" min="1" max="5" value="1"></div><div class="fld" style="max-width:120px"><label for="arSpeed">Speed</label><select id="arSpeed"><option value="6">Watch (6×)</option><option value="60" selected>Fast</option><option value="400">Fastest</option></select></div>
<button class="go" id="arRun" type="button" style="font-size:17px;padding:4px 14px">RUN JOURNEY</button><button class="go alt" id="arDuel" type="button" style="font-size:17px;padding:4px 14px">RUN DUELS</button></div>
<div id="arBoard" style="margin-top:10px">${boardHTML(last&&last.board)}</div><div id="arLog" class="note"></div></section>
<section><h3>Learning league</h3><p class="note">Each round the learning agents (Student, endpoint agents) practise on the practice seeds and learn from their match reports; then every ticked agent plays the test seeds, which nobody practises on. A rising test score is real learning.</p>
<div class="row" style="align-items:flex-end"><div class="fld" style="max-width:90px"><label for="lgRounds">Rounds</label><input id="lgRounds" type="number" min="1" max="40" value="5"></div><div class="fld" style="max-width:110px"><label for="lgPr">Practice seeds</label><input id="lgPr" type="number" min="1" max="5" value="2"></div><div class="fld" style="max-width:100px"><label for="lgTe">Test seeds</label><input id="lgTe" type="number" min="1" max="5" value="2"></div>
<button class="go" id="lgRun" type="button" style="font-size:17px;padding:4px 14px">RUN LEAGUE</button><button class="ub2" id="lgForget" type="button">Forget Student's memory</button></div>
<div id="lgOut" style="margin-top:10px">${leagueHTML(lastLg)}</div></section>
<section><h3>Duel — your train against another</h3><p class="note">Fought with your saved train and crew if you have a run in progress, otherwise a fresh one. The rival is a mirror of your train, or a train card pasted below. A duel ends when one crew is dead or gives up.</p>
<div class="row"><button class="go" id="arFight" type="button" style="font-size:17px;padding:4px 14px">FIGHT A MIRROR</button><button class="ub2" id="arCard" type="button">Copy my train card</button></div>
<div class="fld" style="margin-top:8px"><label for="arIn">Rival train card</label><input id="arIn" placeholder="paste a train card, then FIGHT THIS CARD"></div><div class="row" style="margin-top:6px"><button class="ub2" id="arFightCard" type="button">FIGHT THIS CARD</button></div></section>
<div class="btns"><button class="go alt" id="arBack" type="button">← BACK TO TITLE</button></div>`;
const picks=()=>[...panel.querySelectorAll('[data-bot]:checked')].map(e=>e.dataset.bot).concat([...panel.querySelectorAll('[data-ext]:checked')].map(e=>ARENA.agents[+e.dataset.ext]));
const go=async duel=>{const agents=picks();if(!agents.length)return;const n=clamp(+$('arSeeds').value||1,1,10),opt={agents,seeds:Array.from({length:n},(_,i)=>i+1),legs:clamp(+$('arLegs').value||1,1,5),speed:+$('arSpeed').value||60,duel};
const out=await agentTournament(opt);showArena();$('arLog').textContent=out.rows.map(r=>`${r.agent} · seed ${r.seed} · ${r.result} · ${r.score} pts · ${r.simMinutes} min`).join('  |  ')};
$('arRun').onclick=()=>go(false);$('arDuel').onclick=()=>go(true);
$('lgRun').onclick=async()=>{const agents=picks();if(!agents.length)return;const np=clamp(+$('lgPr').value||2,1,5),nt=clamp(+$('lgTe').value||2,1,5);
await agentLeague({agents,rounds:clamp(+$('lgRounds').value||5,1,40),practice:Array.from({length:np},(_,i)=>i+1),test:Array.from({length:nt},(_,i)=>1001+i),legs:clamp(+$('arLegs').value||1,1,5),speed:+$('arSpeed').value||60});showArena()};
$('lgForget').onclick=()=>{try{localStorage.removeItem(STUDENT_KEY)}catch(e){}$('lgOut').insertAdjacentHTML('beforeend','<p class="note">Student starts from scratch.</p>')};
$('arAdd').onclick=()=>{const n=$('arName').value.trim(),u=$('arUrl').value.trim();if(!n||!/^https?:\/\//.test(u))return;ARENA.agents.push(endpointAgent(n,u));showArena()};
$('arFight').onclick=()=>startDuel(null);
$('arFightCard').onclick=()=>{const c=readTrainCard($('arIn').value);if(!c){$('arLog').textContent='That is not a valid train card.';return}startDuel(c)};
$('arCard').onclick=async()=>{const t=trainCard();try{await navigator.clipboard.writeText(t);$('arLog').textContent='Train card copied — send it to someone to fight your train.'}catch(e){$('arIn').value=t;$('arLog').textContent='Copy it from the box.'}};
$('arBack').onclick=()=>{panel.className='panel';showTitle()}}
window.IronAsh={version:GAME_VERSION,actions:AGENT_ACTIONS,bots:BOTS,observe:agentObserve,act:a=>withSimRng(()=>agentAct(a)),score:agentScore,run:agentRun,tournament:agentTournament,league:agentLeague,rulebook:agentRulebook,report:()=>ARENA.lastReport||null,student:()=>studentMem(),forget:()=>{try{localStorage.removeItem(STUDENT_KEY)}catch(e){}},endpointAgent,duel:startDuel,trainCard,readTrainCard,stop:()=>{ARENA.stop=true}};
})();
</script>
